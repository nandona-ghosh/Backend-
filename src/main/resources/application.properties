spring.application.name=food-plant-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodplant}
spring.datasource.username=${DB_USER:foodplant}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
logging.structured.format.console=logstash
springdoc.api-docs.path=/v3/api-docs
plant.security.secret=${JWT_SECRET}
plant.security.admin-hash=${ADMIN_PASSWORD_HASH}
plant.security.staff-hash=${STAFF_PASSWORD_HASH}
plant.security.user-hash=${USER_PASSWORD_HASH}
plant.rate.general-per-minute=${RATE_GENERAL_PER_MINUTE:12000}
plant.rate.login-per-minute=${RATE_LOGIN_PER_MINUTE:10}
